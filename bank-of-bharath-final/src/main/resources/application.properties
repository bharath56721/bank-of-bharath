spring.application.name=bank-of-bharath
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_of_bharath?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:system}
spring.datasource.password=${DB_PASS:system}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-of-at-least-32-chars}
jwt.expiry-ms=3600000
